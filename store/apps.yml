# SealSkin app store: add the raw URL of this file as a store in the SealSkin admin UI.
apps:
  - id: "gaming-desktop"
    name: "Gaming Desktop (KDE)"
    logo: "https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webtop-logo.png"
    url: "https://github.com/XCraftTM/sealskin-gaming"
    provider: "docker"
    provider_config:
      image: "ghcr.io/xcrafttm/sealskin-gaming:latest"
      port: 3000
      nvidia_support: false
      dri3_support: true
      type: "desktop"
      autostart: false
      url_support: false
      open_support: true
      extensions: [exe, msi]
      # The Flatpak sandbox (Bottles, Discover installs) also needs the container to run
      # privileged. SealSkin ignores `privileged` from store entries (only an admin may grant
      # it), so set it in the admin UI: an app template with DOCKER_PRIVILEGED=true, or an
      # admin override on the installed app. See the README.
      docker_overrides:
        shm_size: "1g"
        environment:
          # Your physical keyboard layout (XKB name: de, us, fr, ch, gb, ...)
          KEYBOARD_LAYOUT: "de"
